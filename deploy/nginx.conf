server {
    listen 80;
    listen [::]:80;
    server_name sync.utils.pemsoft.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.utils.pemsoft.org;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/sync.utils.pemsoft.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.utils.pemsoft.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:38471;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
