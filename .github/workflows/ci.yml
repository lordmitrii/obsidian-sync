name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev libsqlite3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl sqlite3
          echo "CMAKE_EXTRA_ARGS=-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ env.CMAKE_EXTRA_ARGS }}

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: HTTP smoke test
        run: tests/http-smoke.sh

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev libsqlite3-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure with ASan and UBSan
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-asan -j

      - name: Unit tests
        run: ctest --test-dir build-asan --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev libsqlite3-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: deps-tsan-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure with ThreadSanitizer
        run: >
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-tsan -j

      - name: Unit tests
        run: ctest --test-dir build-tsan --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev libcurl4-openssl-dev libsqlite3-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build-fuzz/_deps
          key: deps-fuzz-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++ -DOBSIDIAN_SYNC_BUILD_FUZZERS=ON

      - name: Build fuzzers
        run: cmake --build build-fuzz -j --target fuzz-manifest fuzz-path-validation

      - name: Fuzz manifest parsing
        run: build-fuzz/fuzz-manifest -max_total_time=60 tests/fuzz/corpus/manifest

      - name: Fuzz path validation
        run: build-fuzz/fuzz-path-validation -max_total_time=60 tests/fuzz/corpus/path_validation
